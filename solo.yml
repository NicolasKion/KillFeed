# Visit https://soloterm.com to learn more
name: killfeed
icon: null
processes:
  npm:dev:
    command: npm run dev
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Horizon:
    command: php artisan horizon
    working_dir: null
    auto_start: false
    auto_restart: true
    restart_when_changed:
      - app/Jobs/**
    env: {}
  Listener:
    command: php artisan app:listen-for-kills
    working_dir: null
    auto_start: false
    auto_restart: true
    restart_when_changed:
      - app/Console/Commands/ListenForKills.php
      - app/Services/**
    env: {}
  Scheduler:
    command: php artisan schedule:work
    working_dir: null
    auto_start: false
    auto_restart: true
    restart_when_changed: []
    env: {}
  Logs:
    command: tail -n 50 -f storage/logs/laravel.log
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Tests:
    command: php artisan test
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Pint:
    command: vendor/bin/pint --test
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  PHPStan:
    command: composer analyse
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
